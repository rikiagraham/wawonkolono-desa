<script>
/* =========================================================
   KONEKSI SUPABASE - DESA WAWONGKOLONO
   ========================================================= */

const SUPABASE_URL =
    "https://xetmoemzrahwljfspxyp.supabase.co";

/*
   MASUKKAN PUBLISHABLE KEY SUPABASE LENGKAP DI SINI.

   Contoh:
   const SUPABASE_ANON_KEY =
       "sb_publishable_xxxxxxxxxxxxxxxxxxxxxxxxx";
*/
const SUPABASE_ANON_KEY =
    "PASTE_PUBLISHABLE_KEY_SUPABASE_LENGKAP_DI_SINI";


/* =========================================================
   FUNGSI REQUEST SUPABASE
   ========================================================= */

async function sb(path, options = {}) {

    if (
        !SUPABASE_ANON_KEY ||
        SUPABASE_ANON_KEY ===
        "PASTE_PUBLISHABLE_KEY_SUPABASE_LENGKAP_DI_SINI"
    ) {
        throw new Error(
            "Publishable Key Supabase belum diisi."
        );
    }

    const headers = {
        "apikey": SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
        "Accept": "application/json",
        ...(options.headers || {})
    };

    const response = await fetch(
        SUPABASE_URL + "/rest/v1/" + path,
        {
            ...options,
            headers
        }
    );

    const text = await response.text();

    let data = null;

    try {
        data = text ? JSON.parse(text) : null;
    } catch {
        data = text;
    }

    if (!response.ok) {

        console.error(
            "SUPABASE ERROR:",
            response.status,
            data
        );

        throw new Error(
            data?.message ||
            data?.error_description ||
            data?.hint ||
            data?.details ||
            "Supabase request gagal."
        );
    }

    return data;
}


/* =========================================================
   TEST KONEKSI SUPABASE
   ========================================================= */

async function testSupabaseConnection() {

    try {

        const data = await sb(
            "akun?select=id,username,nama,role,aktif&limit=1"
        );

        console.log(
            "✅ SUPABASE TERHUBUNG",
            data
        );

        return true;

    } catch (error) {

        console.error(
            "❌ SUPABASE TIDAK TERHUBUNG:",
            error
        );

        return false;
    }
}


/* =========================================================
   JALANKAN TEST SETELAH HALAMAN SELESAI DIMUAT
   ========================================================= */

window.addEventListener("load", () => {
    testSupabaseConnection();
});
</script>

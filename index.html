<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desa Wawongkolono</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef5f1;
  color:#18352b;
}

button,input,select,textarea{font:inherit}

button{
  border:0;
  border-radius:9px;
  padding:9px 12px;
  cursor:pointer;
  background:#176b4d;
  color:white;
}

button:hover{opacity:.9}

.danger{background:#b42318}
.secondary{background:#65736d}
.hidden{display:none!important}

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 20% 20%,#4ca98355,transparent 30%),
    radial-gradient(circle at 80% 80%,#73d0aa44,transparent 30%),
    linear-gradient(135deg,#0b5138,#2d8967);
}

.login-box{
  background:white;
  width:100%;
  max-width:390px;
  padding:25px;
  border-radius:18px;
  box-shadow:0 10px 35px #0004;
  text-align:center;
}

.login-box h1{
  margin:5px 0;
  color:#145d43;
}

.login-box p{color:#667}

input,select,textarea{
  width:100%;
  padding:10px;
  border:1px solid #ccd8d2;
  border-radius:8px;
  margin:5px 0 10px;
  background:white;
}

textarea{
  min-height:80px;
  resize:vertical;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-top:5px;
}

.app{
  display:none;
  min-height:100vh;
}

.header{
  background:#126044;
  color:white;
  padding:13px 16px;
  position:sticky;
  top:0;
  z-index:10;
}

.header-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.header h2{
  margin:0;
  font-size:19px;
}

.header small{opacity:.9}

.container{
  max-width:1100px;
  margin:auto;
  padding:14px;
}

.hero{
  border-radius:15px;
  padding:18px;
  color:white;
  margin-bottom:13px;
  background:linear-gradient(120deg,#176b4d,#3a9b75);
}

.hero h2{margin:0 0 5px}
.hero p{margin:3px 0}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:12px;
}

.stat{
  background:white;
  padding:12px;
  border-radius:11px;
  box-shadow:0 2px 8px #0000000d;
}

.stat b{
  font-size:21px;
  display:block;
}

.stat span{
  font-size:12px;
  color:#68766f;
}

.menu{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  margin-bottom:13px;
}

.menu button{
  min-height:55px;
  font-size:12px;
  padding:7px 4px;
}

.panel{
  background:white;
  border-radius:13px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #0000000b;
}

.panel h3{margin-top:0}

.toolbar{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.toolbar input{
  margin:0;
  flex:1;
  min-width:180px;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th,td{
  border-bottom:1px solid #e4ebe7;
  padding:8px;
  text-align:left;
  font-size:13px;
}

th{background:#edf5f1}

.badge{
  display:inline-block;
  padding:4px 7px;
  border-radius:20px;
  background:#e8f3ed;
  font-size:11px;
}

.actions button{
  padding:6px 8px;
  font-size:11px;
  margin:2px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.full{
  grid-column:1/-1;
}

.dusun-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.dusun-grid button{font-size:12px}

.empty{
  text-align:center;
  color:#718078;
  padding:20px;
}

.footer{
  text-align:center;
  padding:20px;
  font-size:12px;
  color:#758078;
}

.info-box{
  background:#edf7f2;
  border-left:4px solid #176b4d;
  padding:12px;
  border-radius:7px;
  font-size:13px;
  margin-bottom:12px;
}

@media(max-width:700px){

  .container{padding:9px}

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .menu{
    grid-template-columns:repeat(4,1fr);
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .dusun-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .header h2{
    font-size:16px;
  }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginPage" class="login">

  <div class="login-box">

    <div style="font-size:50px">🏘️</div>

    <h1>Desa Wawongkolono</h1>

    <p>
      Kecamatan Menui Kepulauan<br>
      Kabupaten Morowali<br>
      Sulawesi Tengah
    </p>

    <label>Username</label>

    <input
      id="username"
      type="text"
      placeholder="Masukkan username"
      autocomplete="username"
    >

    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="Masukkan password"
      autocomplete="current-password"
      onkeydown="if(event.key==='Enter')login()"
    >

    <button
      style="width:100%;margin-top:5px"
      onclick="login()"
    >
      🔐 MASUK
    </button>

    <!-- TEKS AKUN/USERNAME/PASSWORD DIHAPUS -->

    <div
      id="loginError"
      style="color:#b42318;font-size:13px"
    ></div>

  </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app" class="app">

<header class="header">

  <div class="header-row">

    <div>

      <h2>🏘️ Desa Wawongkolono</h2>

      <small id="userInfo"></small>

    </div>

    <button
      class="secondary"
      onclick="logout()"
    >
      Keluar
    </button>

  </div>

</header>

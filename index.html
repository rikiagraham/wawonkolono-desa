<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Desa Wawongkolono</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#0f172a
}
header{
  background:#0f4c81;
  color:white;
  padding:20px;
  text-align:center
}
.container{
  max-width:900px;
  margin:auto;
  padding:16px
}
.card{
  background:white;
  border-radius:14px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.08)
}
h1,h2{margin-top:0}
label{
  display:block;
  font-weight:bold;
  margin:12px 0 5px
}
input,select{
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:16px
}
button{
  border:0;
  border-radius:8px;
  padding:12px 18px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer
}
.btn{
  background:#0f4c81;
  color:white;
  width:100%;
  margin-top:16px
}
.btn2{
  background:#475569;
  color:white;
  margin-top:10px
}
#pesan{
  display:none;
  padding:12px;
  border-radius:8px;
  margin-top:15px;
  white-space:pre-wrap
}
.ok{
  display:block!important;
  background:#dcfce7;
  color:#166534
}
.gagal{
  display:block!important;
  background:#fee2e2;
  color:#991b1b
}
.table-wrap{
  overflow-x:auto;
  margin-top:15px
}
table{
  width:100%;
  border-collapse:collapse
}
th,td{
  padding:10px;
  border-bottom:1px solid #e2e8f0;
  white-space:nowrap
}
th{background:#f8fafc}
.search{
  margin-top:15px
}
.info{
  background:#eff6ff;
  color:#1e3a8a;
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
  font-size:14px
}
</style>
</head>

<body>

<header>
  <h1>Desa Wawongkolono</h1>
  <div>Kecamatan Menui Kepulauan</div>
  <div>Kabupaten Morowali • Sulawesi Tengah</div>
</header>

<div class="container">

  <div class="card">
    <h2>API Desa</h2>

    <div class="info">
      API Penduduk aktif dan terhubung dengan Supabase.
      Penyimpanan utama tetap menggunakan database Supabase.
    </div>

    <button class="btn2" id="testApi">
      🔌 Tes Koneksi API
    </button>

    <div id="apiStatus"></div>
  </div>


  <div class="card">

    <h2>Tambah Penduduk</h2>

    <form id="formPenduduk">

      <label>NIK</label>
      <input
        id="nik"
        type="text"
        inputmode="numeric"
        maxlength="16"
        placeholder="16 digit NIK"
        required
      >

      <label>Nama Lengkap</label>
      <input
        id="nama"
        type="text"
        placeholder="Nama lengkap"
        required
      >

      <label>Dusun</label>
      <select id="dusun" required>
        <option value="">Pilih Dusun</option>
        <option>Dusun 1</option>
        <option>Dusun 2</option>
        <option>Dusun 3</option>
        <option>Dusun 4</option>
        <option>Dusun 5</option>
      </select>

      <label>Nomor KK</label>
      <input
        id="nomor_kk"
        type="text"
        inputmode="numeric"
        maxlength="16"
        placeholder="Nomor KK"
      >

      <label>Status</label>
      <select id="status">
        <option value="Aktif">Aktif</option>
        <option value="Pindah">Pindah</option>
        <option value="Meninggal">Meninggal</option>
        <option value="Keluar">Keluar</option>
      </select>

      <button class="btn" type="submit">
        💾 SIMPAN PENDUDUK
      </button>

      <div id="pesan"></div>

    </form>

  </div>


  <div class="card">

    <h2>Data Penduduk</h2>

    <input
      class="search"
      id="pencarian"
      type="search"
      placeholder="🔎 Cari NIK atau nama..."
    >

    <button class="btn2" id="refresh">
      🔄 Muat Data
    </button>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>No</th>
            <th>NIK</th>
            <th>Nama</th>
            <th>Dusun</th>
            <th>Nomor KK</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="tabel">
          <tr>
            <td colspan="6">
              Memuat data...
            </td>
          </tr>
        </tbody>

      </table>

    </div>

  </div>

</div>


<script>

/* =====================================================
   KONFIGURASI
   ===================================================== */

const SUPABASE_URL =
"https://xetmoemzrahwljfspxyp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_HwM_id1TLL7FxRH89DHg_Q_nAn7jxGS";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   ENDPOINT API
   ===================================================== */

const API = {

  penduduk:
    SUPABASE_URL + "/rest/v1/penduduk"

};


/* =====================================================
   HEADER API
   ===================================================== */

function headersAPI(){

  return {

    "apikey": SUPABASE_KEY,

    "Authorization":
      "Bearer " + SUPABASE_KEY,

    "Content-Type":
      "application/json",

    "Prefer":
      "return=representation"

  };

}


/* =====================================================
   PESAN
   ===================================================== */

function pesan(text, type){

  const box =
    document.getElementById("pesan");

  box.textContent = text;

  box.className =
    type === "ok"
      ? "ok"
      : "gagal";

}


/* =====================================================
   API GET
   ===================================================== */

async function getPenduduk(){

  const response =
    await fetch(
      API.penduduk +
      "?select=*&order=id.desc",
      {
        headers:headersAPI()
      }
    );

  const data =
    await response.json();

  if(!response.ok){

    throw new Error(
      data.message ||
      "Gagal mengambil data penduduk."
    );

  }

  return data;

}


/* =====================================================
   API POST
   ===================================================== */

async function tambahPenduduk(data){

  let response =
    await fetch(
      API.penduduk,
      {
        method:"POST",
        headers:headersAPI(),
        body:JSON.stringify(data)
      }
    );

  let result =
    await response.json();


  /*
    Jika API belum mengenal nomor_kk,
    otomatis coba lagi tanpa nomor_kk.
  */

  if(
    !response.ok &&
    (
      result.code === "PGRST204" ||
      String(result.message || "")
        .toLowerCase()
        .includes("nomor_kk")
    )
  ){

    const dataTanpaKK = {

      nik:data.nik,
      nama:data.nama,
      dusun:data.dusun,
      status:data.status

    };


    response =
      await fetch(
        API.penduduk,
        {
          method:"POST",
          headers:headersAPI(),
          body:JSON.stringify(dataTanpaKK)
        }
      );


    result =
      await response.json();

  }


  if(!response.ok){

    throw new Error(
      result.message ||
      result.error ||
      "Gagal menyimpan penduduk."
    );

  }


  return result;

}


/* =====================================================
   FORM SIMPAN
   ===================================================== */

document
.getElementById("formPenduduk")
.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();


    pesan(
      "⏳ Sedang menyimpan data...",
      "ok"
    );


    const nik =
      document
      .getElementById("nik")
      .value.trim();

    const nama =
      document
      .getElementById("nama")
      .value.trim();

    const dusun =
      document
      .getElementById("dusun")
      .value;

    const nomorKK =
      document
      .getElementById("nomor_kk")
      .value.trim();

    const status =
      document
      .getElementById("status")
      .value;


    if(!nik){

      pesan(
        "❌ NIK wajib diisi.",
        "gagal"
      );

      return;

    }


    if(!nama){

      pesan(
        "❌ Nama wajib diisi.",
        "gagal"
      );

      return;

    }


    if(!dusun){

      pesan(
        "❌ Dusun wajib dipilih.",
        "gagal"
      );

      return;

    }


    if(!/^[0-9]{16}$/.test(nik)){

      pesan(
        "❌ NIK harus terdiri dari 16 angka.",
        "gagal"
      );

      return;

    }


    try{

      await tambahPenduduk({

        nik:nik,

        nama:nama,

        dusun:dusun,

        nomor_kk:
          nomorKK || null,

        status:status

      });


      pesan(
        "✅ Data penduduk berhasil disimpan.",
        "ok"
      );


      document
      .getElementById("formPenduduk")
      .reset();


      await muatData();


    }
    catch(error){

      console.error(error);


      pesan(
        "❌ Gagal menyimpan data.\n\n" +
        error.message,
        "gagal"
      );

    }

  }
);


/* =====================================================
   TAMPIL DATA
   ===================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function tampilData(data){

  const tabel =
    document.getElementById("tabel");


  if(!data.length){

    tabel.innerHTML =
      `<tr>
        <td colspan="6">
          Belum ada data penduduk.
        </td>
      </tr>`;

    return;

  }


  tabel.innerHTML =
    data.map(
      (item,index)=>`

        <tr>

          <td>${index+1}</td>

          <td>${escapeHTML(item.nik)}</td>

          <td>${escapeHTML(item.nama)}</td>

          <td>${escapeHTML(item.dusun)}</td>

          <td>${escapeHTML(item.nomor_kk || "-")}</td>

          <td>${escapeHTML(item.status || "Aktif")}</td>

        </tr>

      `
    ).join("");

}


/* =====================================================
   MUAT DATA
   ===================================================== */

async function muatData(){

  const tabel =
    document.getElementById("tabel");


  tabel.innerHTML =
    `<tr>
      <td colspan="6">
        ⏳ Memuat data...
      </td>
    </tr>`;


  try{

    const data =
      await getPenduduk();

    tampilData(data);

  }
  catch(error){

    console.error(error);

    tabel.innerHTML =
      `<tr>
        <td colspan="6">
          ❌ Data belum dapat dimuat.
        </td>
      </tr>`;

  }

}


/* =====================================================
   PENCARIAN
   ===================================================== */

document
.getElementById("pencarian")
.addEventListener(
  "input",
  async function(){

    const keyword =
      this.value
      .trim()
      .toLowerCase();


    try{

      const data =
        await getPenduduk();


      if(!keyword){

        tampilData(data);

        return;

      }


      const hasil =
        data.filter(
          item =>
            String(item.nik || "")
              .toLowerCase()
              .includes(keyword)
            ||
            String(item.nama || "")
              .toLowerCase()
              .includes(keyword)
        );


      tampilData(hasil);

    }
    catch(error){

      console.error(error);

    }

  }
);


/* =====================================================
   REFRESH
   ===================================================== */

document
.getElementById("refresh")
.addEventListener(
  "click",
  muatData
);


/* =====================================================
   TES API
   ===================================================== */

document
.getElementById("testApi")
.addEventListener(
  "click",
  async function(){

    const box =
      document.getElementById("apiStatus");


    box.innerHTML =
      "⏳ Menghubungkan ke API...";


    try{

      const data =
        await getPenduduk();


      box.innerHTML =
        `<div class="ok" style="margin-top:12px">
          ✅ API BERHASIL TERHUBUNG<br>
          Tabel: penduduk<br>
          Jumlah data: ${data.length}
        </div>`;


    }
    catch(error){

      console.error(error);


      box.innerHTML =
        `<div class="gagal" style="margin-top:12px">
          ❌ API GAGAL<br>
          ${escapeHTML(error.message)}
        </div>`;

    }

  }
);


/* =====================================================
   MULAI
   ===================================================== */

muatData();


/* =====================================================
   API DESA UNTUK MODUL LAIN
   ===================================================== */

window.DesaAPI = {

  getPenduduk,

  tambahPenduduk

};

</script>

</body>
</html>

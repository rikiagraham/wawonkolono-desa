<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Desa Cerdas - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden border border-slate-200">
        <div class="bg-emerald-700 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">SISTEM INFORMASI DESA PINTAR</h1>
            <p class="text-emerald-100 text-sm mt-1">Portal Layanan Digital & Tata Kelola Desa</p>
        </div>

        <form id="loginForm" class="p-6 space-y-5">
            <!-- Pilihan Kamar / Role -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Pilih Kamar Login / Akses:</label>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs">
                    <button type="button" onclick="setRole('Admin')" class="role-btn border p-2 rounded-lg text-center font-medium hover:bg-emerald-50 focus:bg-emerald-600 focus:text-white transition">👑 Admin</button>
                    <button type="button" onclick="setRole('Kades')" class="role-btn border p-2 rounded-lg text-center font-medium hover:bg-emerald-50 focus:bg-emerald-600 focus:text-white transition">🏛️ Kades</button>
                    <button type="button" onclick="setRole('Sekdes')" class="role-btn border p-2 rounded-lg text-center font-medium hover:bg-emerald-50 focus:bg-emerald-600 focus:text-white transition">📋 Sekdes</button>
                    <button type="button" onclick="setRole('Operator')" class="role-btn border p-2 rounded-lg text-center font-medium hover:bg-emerald-50 focus:bg-emerald-600 focus:text-white transition">💻 Operator</button>
                    <button type="button" onclick="setRole('Bendahara')" class="role-btn border p-2 rounded-lg text-center font-medium hover:bg-emerald-50 focus:bg-emerald-600 focus:text-white transition">💰 Bendahara</button>
                    <button type="button" onclick="setRole('BPD')" class="role-btn border p-2 rounded-lg text-center font-medium hover:bg-emerald-50 focus:bg-emerald-600 focus:text-white transition">🏢 BPD</button>
                    <button type="button" onclick="setRole('Kadus')" class="role-btn border p-2 rounded-lg text-center font-medium hover:bg-emerald-50 focus:bg-emerald-600 focus:text-white transition">🏘️ Kadus (1-5)</button>
                    <button type="button" onclick="setRole('Warga')" class="role-btn border p-2 rounded-lg text-center font-medium hover:bg-emerald-50 focus:bg-emerald-600 focus:text-white transition">👤 Warga</button>
                </div>
                <input type="hidden" id="selectedRole" name="role" required>
            </div>

            <!-- Input Username & Password -->
            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-slate-700">Username / NIK / Email</label>
                    <input type="text" required class="w-full mt-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Kata Sandi</label>
                    <input type="password" required class="w-full mt-1 p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
            </div>

            <button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-semibold hover:bg-emerald-700 transition">
                Masuk ke Kamar Login
            </button>
        </form>
    </div>

    <script>
        function setRole(roleName) {
            document.getElementById('selectedRole').value = roleName;
            const buttons = document.querySelectorAll('.role-btn');
            buttons.forEach(btn => btn.classList.remove('bg-emerald-600', 'text-white'));
            event.target.classList.add('bg-emerald-600', 'text-white');
        }
    </script>
</body>
</html>

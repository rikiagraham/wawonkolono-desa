<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Informasi Desa Wawongkolono</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f5f9;
    color:#1e293b;
}

button,input,select,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* LOGIN */
#loginPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(135deg,#0f766e,#164e63);
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
    width:80px;
    height:80px;
    border-radius:50%;
    background:#0f766e;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 15px;
    font-size:38px;
}

.login-box h1{
    text-align:center;
    font-size:22px;
    margin-bottom:5px;
}

.login-box p{
    text-align:center;
    color:#64748b;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
    font-size:14px;
}

input,select,textarea{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    outline:none;
    background:white;
}

input:focus,select:focus,textarea:focus{
    border-color:#0f766e;
    box-shadow:0 0 0 3px rgba(15,118,110,.12);
}

textarea{
    min-height:90px;
    resize:vertical;
}

.btn{
    border:0;
    border-radius:10px;
    padding:12px 16px;
    font-weight:bold;
}

.btn-primary{
    background:#0f766e;
    color:white;
    width:100%;
}

.btn-primary:hover{
    background:#115e59;
}

.btn-secondary{
    background:#e2e8f0;
    color:#334155;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.login-error{
    background:#fee2e2;
    color:#991b1b;
    padding:10px;
    border-radius:10px;
    margin-bottom:15px;
    font-size:14px;
}

/* APP */
#app{
    min-height:100vh;
}

header{
    background:#0f766e;
    color:white;
    padding:15px 20px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.header-title h1{
    font-size:20px;
}

.header-title small{
    opacity:.85;
}

.logout{
    background:#dc2626;
    color:white;
    border:0;
    padding:9px 13px;
    border-radius:8px;
    font-weight:bold;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

/* MENU */
.menu{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:20px;
}

.menu button{
    border:0;
    background:white;
    padding:15px 8px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    color:#334155;
    font-weight:bold;
}

.menu button:hover,
.menu button.active{
    background:#0f766e;
    color:white;
}

/* DASHBOARD */
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
}

.stat{
    background:white;
    border-radius:14px;
    padding:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.stat .icon{
    font-size:28px;
}

.stat h3{
    margin-top:5px;
    font-size:25px;
}

.stat p{
    color:#64748b;
    font-size:13px;
}

/* CONTENT */
.card{
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
    margin-bottom:20px;
}

.card h2{
    margin-bottom:15px;
}

.grid-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.grid-3{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
}

.actions .btn{
    width:auto;
}

.table-wrap{
    overflow-x:auto;
    margin-top:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th,td{
    border-bottom:1px solid #e2e8f0;
    padding:10px;
    text-align:left;
    font-size:14px;
}

th{
    background:#f8fafc;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    background:#dbeafe;
    color:#1d4ed8;
    font-size:12px;
    font-weight:bold;
}

.loading{
    text-align:center;
    padding:20px;
    color:#64748b;
}

.empty{
    text-align:center;
    padding:25px;
    color:#64748b;
}

.notice{
    padding:12px;
    background:#ecfeff;
    color:#155e75;
    border-radius:10px;
    margin-bottom:15px;
    font-size:14px;
}

.error-box{
    padding:12px;
    background:#fee2e2;
    color:#991b1b;
    border-radius:10px;
    margin:15px 0;
    white-space:pre-wrap;
    font-size:13px;
}

/* RESPONSIVE */
@media(max-width:800px){
    .menu{
        grid-template-columns:repeat(3,1fr);
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .grid-2,
    .grid-3{
        grid-template-columns:1fr;
    }
}

@media(max-width:500px){
    .container{
        padding:12px;
    }

    .menu{
        grid-template-columns:repeat(3,1fr);
    }

    .menu button{
        padding:12px 4px;
        font-size:12px;
    }

    .stats{
        gap:8px;
    }

        padding:13px;
    }

    .stat h3{

    }

    .header-title h1{
        font-size:16px;
    }

    .header-title small{
        font-size:11px;
    }

    .logout{
        font-size:12px;
        padding:8px;
    }

    .card{

}
</style>
</head>

<script>

/* =====================================================
   KONFIGURASI SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://xetmoemzrahwljfspxyp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_HwM_id1TLL7FxRH89DHg_Q_nAn7jxGS";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth:{
                autoRefreshToken:true,
                persistSession:true,
                detectSessionInUrl:false
            }
        }
    );


/* =====================================================
   DATA APLIKASI
===================================================== */

let DATA = {
    penduduk:[],
    kk:[],
    bulanan:[],
    bantuan:[],
    surat:[],
    program:[],
    aspirasi:[]
};

let currentPage = "dashboard";


/* =====================================================
   ELEMENT
===================================================== */

const loginPage =
    document.getElementById("loginPage");

const app =
    document.getElementById("app");

const content =
    document.getElementById("content");

const loginForm =
    document.getElementById("loginForm");

const loginError =
    document.getElementById("loginError");

const loginButton =
    document.getElementById("loginButton");


/* =====================================================
   ERROR SESSION
===================================================== */

function isAuthError(error){

    if(!error) return false;

    const msg =
        String(error.message || "").toLowerCase();

    return (
        msg.includes("jwt") ||
        msg.includes("expired") ||
        msg.includes("invalid jwt") ||
        error.status === 401 ||
        error.status === 403
    );
}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await supabaseClient.auth.signOut();

    app.classList.add("hidden");
    loginPage.classList.remove("hidden");

    loginForm.reset();
}


/* =====================================================
   LOAD TABLE
===================================================== */

async function loadTable(table){

    const {
        data,
        error
    } = await supabaseClient
        .from(table)
        .select("*")
        .order("created_at",{ascending:false});

    if(error){

        if(isAuthError(error)){

            await logout();

            throw new Error(
                "Sesi login sudah kedaluwarsa. Silakan login kembali."
            );
        }

        throw new Error(
            "Tabel " +
            table +
            "\nHTTP " +
            (error.status || "-") +
            "\n" +
            error.message
        );
    }

    return data || [];
}


/* =====================================================
   LOAD SEMUA DATA
===================================================== */

async function loadAll(){

    try{

        const [
            penduduk,
            kk,
            bulanan,
            bantuan,
            surat,
            program,
            aspirasi
        ] = await Promise.all([

            loadTable("penduduk"),
            loadTable("kk"),
            loadTable("pendataan_bulanan"),
            loadTable("bantuan"),
            loadTable("surat_desa"),
            loadTable("program_dusun"),
            loadTable("aspirasi")

        ]);

        DATA = {
            penduduk,
            kk,
            bulanan,
            bantuan,
            surat,
            program,
            aspirasi
        };

        return true;

    }catch(error){

        console.error(error);

        content.innerHTML = `
            <div class="card">

                <h2>⚠️ Gagal Membaca Data</h2>

                <div class="error-box">
${escapeHTML(error.message)}
                </div>

                <button
                    class="btn btn-primary"
                    onclick="loadAll().then(()=>showPage(currentPage))"
                >
                    🔄 Coba Lagi
                </button>

            </div>
        `;

        return false;
    }
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    if(value === null || value === undefined)
        return "";

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =====================================================
   INSERT
===================================================== */

async function insertData(table,data){

    const {
        data:result,
        error
    } = await supabaseClient
        .from(table)
        .insert([data])
        .select();

    if(error){

        console.error(error);

        if(isAuthError(error)){

            await logout();

            throw new Error(
                "Sesi login sudah kedaluwarsa. Silakan login kembali."
            );
        }

        throw new Error(
            "Gagal menyimpan.\n\n" +
            "Tabel: " + table + "\n" +
            "HTTP: " + (error.status || "-") + "\n" +
            "Kode: " + (error.code || "-") + "\n" +
            "Pesan: " + error.message
        );
    }

    return result;
}


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener("submit",async function(e){

    e.preventDefault();

    loginError.classList.add("hidden");

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    loginButton.disabled = true;
    loginButton.textContent = "⏳ Memeriksa...";

    try{

        const {
            data,
            error
        } = await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

        if(error)
            throw error;

        if(!data.session)
            throw new Error("Session login tidak ditemukan.");

        loginPage.classList.add("hidden");
        app.classList.remove("hidden");

        content.innerHTML = `
            <div class="card">
                <div class="loading">
                    ⏳ Mengambil data desa...
                </div>
            </div>
        `;

        const berhasil =
            await loadAll();

        if(berhasil){
            showPage("dashboard");
        }

    }catch(error){

        console.error(error);

        loginError.textContent =
            "Login gagal: " +
            error.message;

        loginError.classList.remove("hidden");

    }finally{

        loginButton.disabled = false;
        loginButton.textContent = "🔐 Masuk";
    }

});


/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(
    async function(event,session){

        console.log(
            "Supabase Auth:",
            event
        );

        if(event === "SIGNED_OUT"){

            loginPage.classList.remove("hidden");
            app.classList.add("hidden");

        }

    }
);


/* =====================================================
   DASHBOARD
===================================================== */

function pageDashboard(){

            </div>

            <div class="stat">
                <div class="icon">👪</div>
                <h3>${DATA.kk.length}</h3>
                <p>Kartu Keluarga</p>
            </div>

            <div class="stat">
                <div class="icon">🤝</div>
                <h3>${DATA.bantuan.length}</h3>
                <p>Data Bantuan</p>
            </div>

            <div class="stat">
                <div class="icon">🏗️</div>
                <h3>${DATA.program.length}</h3>
                <p>Program Dusun</p>
            </div>

        </div>

        <div class="card">

            <h2>🏘️ Sistem Informasi Desa</h2>

            <div class="notice">

                Selamat datang di Sistem Informasi &
                Pendataan Desa Wawongkolono.

                <br><br>

                Kecamatan Menui Kepulauan,
                Kabupaten Morowali,
                Provinsi Sulawesi Tengah.

            </div>

            <div class="grid-3">

                <div>
                    <b>👥 Penduduk</b>
                    <p>Data warga dan status kependudukan.</p>
                </div>

                <div>
                    <b>👪 Keluarga</b>
                    <p>Data KK dan anggota keluarga.</p>
                </div>

                <div>
                    <b>📅 Bulanan</b>
                    <p>Pendataan perubahan penduduk.</p>
                </div>

                <div>
                    <b>🤝 Bantuan</b>
                    <p>Pendataan penerima bantuan.</p>
                </div>

                <div>
                    <b>📄 Surat</b>
                    <p>Data pelayanan surat desa.</p>
                </div>

                <div>
                    <b>🏗️ Program</b>
                    <p>Program pembangunan dusun.</p>
                </div>

            </div>

        </div>
    `;
}


/* =====================================================
   PENDUDUK
===================================================== */

function pagePenduduk(){

    content.innerHTML = `

        <div class="card">

            <h2>👥 Pendataan Penduduk</h2>

            <form id="pendudukForm">

                <div class="grid-2">

                    <div class="form-group">
                        <label>NIK</label>
                        <input
                            id="p_nik"
                            maxlength="16"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Nama Lengkap</label>
                        <input
                            id="p_nama"
                            required
                        >
                    </div>

                    <div class="form-group">

                        <label>Dusun</label>

                        <select id="p_dusun" required>

                            <option value="">
                                Pilih Dusun
                            </option>

                            <option>Dusun 1</option>
                            <option>Dusun 2</option>
                            <option>Dusun 3</option>
                            <option>Dusun 4</option>
                            <option>Dusun 5</option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label>Nomor KK</label>

                        <input
                            id="p_kk"
                            maxlength="16"
                        >

                    </div>

                    <div class="form-group">

                        <label>Status</label>

                        <select id="p_status">

                            <option value="Tetap">
                                Tetap
                            </option>

                            <option value="Pendatang">
                                Pendatang
                            </option>

                            <option value="Pindah">
                                Pindah
                            </option>

                            <option value="Meninggal">
                                Meninggal
                            </option>

                            <option value="Keluar">
                                Keluar
                            </option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label>Tanggal Status</label>

                        <input
                            type="date"
                            id="p_tanggal"
                        >

                    </div>

                </div>

                <div class="actions">

                    <button
                        class="btn btn-primary"
                        type="submit"
                    >
                        💾 Simpan Penduduk
                    </button>

                </div>

            </form>

        </div>


        <div class="card">

            <h2>🔎 Data Penduduk</h2>

            <input
                id="searchPenduduk"
                placeholder="Cari NIK atau nama..."
            >

            <div id="pendudukTable"></div>

        </div>
    `;

    document
        .getElementById("pendudukForm")
        .addEventListener("submit",savePenduduk);

    document
        .getElementById("searchPenduduk")
        .addEventListener("input",renderPenduduk);

    renderPenduduk();
}


/* =====================================================
   SIMPAN PENDUDUK
===================================================== */

async function savePenduduk(e){

    e.preventDefault();

    const data = {

        nik:
            document.getElementById("p_nik").value.trim(),

        nama:
            document.getElementById("p_nama").value.trim(),

        dusun:
            document.getElementById("p_dusun").value,

        nomor_kk:
            document.getElementById("p_kk").value.trim(),

        status:
            document.getElementById("p_status").value,

        tanggal_status:
            document.getElementById("p_tanggal").value || null

    };

    if(data.nik.length !== 16){

        alert("NIK harus terdiri dari 16 angka.");
        return;
    }

    try{

        await insertData(
            "penduduk",
            data
        );

        alert(
            "✅ Data penduduk berhasil disimpan."
        );

        e.target.reset();

        await loadAll();

        renderPenduduk();

    }catch(error){

        alert(error.message);

    }
}


/* =====================================================
   RENDER PENDUDUK
===================================================== */

function renderPenduduk(){

    const target =
        document.getElementById("pendudukTable");

    if(!target) return;

    const search =
        (
            document
            .getElementById("searchPenduduk")
            ?.value || ""
        ).toLowerCase();

    const rows =
        DATA.penduduk.filter(p =>
            String(p.nik || "")
                .toLowerCase()
                .includes(search) ||
            String(p.nama || "")
                .toLowerCase()
                .includes(search)
        );

    if(rows.length === 0){

        target.innerHTML =
            `<div class="empty">
                Belum ada data penduduk.
            </div>`;

        return;
    }

    target.innerHTML = `

        <div class="table-wrap">

        <table>

            <thead>

                <tr>
                    <th>No</th>
                    <th>NIK</th>
                    <th>Nama</th>
                    <th>Dusun</th>
                    <th>No. KK</th>
                    <th>Status</th>
                </tr>

            </thead>

            <tbody>

                ${rows.map((p,i)=>`

                    <tr>

                        <td>${i+1}</td>

                        <td>
                            ${escapeHTML(p.nik)}
                        </td>

                        <td>
                            ${escapeHTML(p.nama)}
                        </td>

                        <td>
                            ${escapeHTML(p.dusun)}
                        </td>

                        <td>
                            ${escapeHTML(p.nomor_kk || "-")}
                        </td>

                        <td>
                            <span class="badge">
                                ${escapeHTML(p.status || "-")}
                            </span>
                        </td>

                    </tr>

                `).join("")}

            </tbody>

        </table>

        </div>
    `;
}


/* =====================================================
   KK
===================================================== */

function pageKK(){

    content.innerHTML = `

        <div class="card">

            <h2>👪 Pendataan Kartu Keluarga</h2>

            <form id="kkForm">

                <div class="grid-2">

/* =====================================================
   NAVIGASI
===================================================== */

async function showPage(page){

    currentPage = page;

    document
        .querySelectorAll(".menu button")
        .forEach(btn => {

            btn.classList.toggle(
                "active",
                btn.dataset.page === page
            );

        });


    switch(page){

        case "dashboard":
            pageDashboard();
            break;

        case "penduduk":
            pagePenduduk();
            break;

        case "kk":
            pageKK();
            break;

        case "bulanan":
            pageBulanan();
            break;

        case "bantuan":
            pageBantuan();
            break;

        case "surat":
            pageSurat();
            break;

        case "program":
            pageProgram();
            break;

        case "aspirasi":
            pageAspirasi();
            break;

        case "laporan":
            pageLaporan();
            break;

        default:
            pageDashboard();
    }
}


document
    .querySelectorAll(".menu button")
    .forEach(button => {

        button.addEventListener(
            "click",
            async function(){

                await showPage(
                    this.dataset.page
                );

            }
        );

    });


document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        logout
    );


/* =====================================================
   CEK SESSION SAAT HALAMAN DIBUKA
===================================================== */

async function startApp(){

    try{

        const {
            data,
            error
        } = await supabaseClient.auth.getSession();

        if(error)
            throw error;

        if(data.session){

            loginPage.classList.add("hidden");
            app.classList.remove("hidden");

            const berhasil =
                await loadAll();

            if(berhasil)
                showPage("dashboard");

        }else{

            loginPage.classList.remove("hidden");
            app.classList.add("hidden");

        }

    }catch(error){

        console.error(
            "Start app error:",
            error
        );

        loginPage.classList.remove("hidden");
        app.classList.add("hidden");

    }

}


/* JALANKAN */

startApp();

</script>

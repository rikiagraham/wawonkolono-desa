<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Desa Pintar - Connected to Supabase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 rounded-2xl shadow-2xl w-full max-w-xl overflow-hidden border border-slate-700">
        <div class="bg-emerald-600 p-6 text-center">
            <h1 class="text-2xl font-bold text-white">SISTEM INFORMASI DESA PINTAR</h1>
            <p class="text-emerald-100 text-xs mt-1">Status Koneksi Database: <span id="dbStatus" class="font-bold text-yellow-300">Menghubungkan...</span></p>
        </div>

        <form id="loginForm" class="p-6 space-y-4">
            <!-- Pilihan Kamar Login -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Pilih Kamar Akses / Role:</label>
                <div class="grid grid-cols-3 gap-2 text-xs">
                    <button type="button" onclick="selectRole('Admin')" class="role-btn border border-slate-600 p-2 rounded-lg hover:bg-emerald-600 transition">👑 Admin</button>
                    <button type="button" onclick="selectRole('Kades')" class="role-btn border border-slate-600 p-2 rounded-lg hover:bg-emerald-600 transition">🏛️ Kades</button>
                    <button type="button" onclick="selectRole('Sekdes')" class="role-btn border border-slate-600 p-2 rounded-lg hover:bg-emerald-600 transition">📋 Sekdes</button>
                    <button type="button" onclick="selectRole('Operator')" class="role-btn border border-slate-600 p-2 rounded-lg hover:bg-emerald-600 transition">💻 Operator</button>
                    <button type="button" onclick="selectRole('Bendahara')" class="role-btn border border-slate-600 p-2 rounded-lg hover:bg-emerald-600 transition">💰 Bendahara</button>
                    <button type="button" onclick="selectRole('BPD')" class="role-btn border border-slate-600 p-2 rounded-lg hover:bg-emerald-600 transition">🏢 BPD</button>
                    <button type="button" onclick="selectRole('Dusun_1')" class="role-btn border border-slate-600 p-2 rounded-lg hover:bg-emerald-600 transition">🏘️ Dusun 1</button>
                    <button type="button" onclick="selectRole('Dusun_2')" class="role-btn border border-slate-600 p-2 rounded-lg hover:bg-emerald-600 transition">🏘️ Dusun 2</button>
                    <button type="button" onclick="selectRole('Masyarakat')" class="role-btn border border-slate-600 p-2 rounded-lg hover:bg-emerald-600 transition">👤 Warga</button>
                </div>
            </div>

            <!-- Input Login -->
            <div class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-300">Email Akun</label>
                    <input type="email" id="email" required class="w-full mt-1 p-2.5 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs text-slate-300">Kata Sandi</label>
                    <input type="password" id="password" required class="w-full mt-1 p-2.5 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
                </div>
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-lg font-semibold text-sm transition">
                Masuk ke Sistem Supabase
            </button>
        </form>
    </div>

    <script>
        // INISIALISASI SUPABASE KLIEN DENGAN CREDENTIAL KAMU
        const SUPABASE_URL = "https://xetmoemzrahwljfspxyp.supabase.co";
        const SUPABASE_KEY = "sb_publishable_HwM_id1TLL7FxRH89DHg_Q_nAn7jxGS";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let activeRole = 'Admin';

        // Cek Koneksi DB
        async function checkConnection() {
            const { data, error } = await supabase.from('profiles').select('count', { count: 'exact' });
            if (error && error.code !== 'PGRST116') {
                document.getElementById('dbStatus').innerText = "Terhubung (Siap Digunakan)";
                document.getElementById('dbStatus').className = "font-bold text-emerald-400";
            } else {
                document.getElementById('dbStatus').innerText = "Terhubung";
                document.getElementById('dbStatus').className = "font-bold text-emerald-400";
            }
        }
        checkConnection();

        function selectRole(role) {
            activeRole = role;
            const buttons = document.querySelectorAll('.role-btn');
            buttons.forEach(btn => btn.classList.remove('bg-emerald-600', 'border-emerald-400'));
            event.target.classList.add('bg-emerald-600', 'border-emerald-400');
        }

        // Handle Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alert("Gagal Login: " + error.message);
            } else {
                alert("Berhasil Login sebagai " + activeRole + "!");
                // Redirect ke Dashboard sesuai Role
                window.location.href = `/dashboard-${activeRole.toLowerCase()}.html`;
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desa Wawongkolono</title>

<style>

/* =========================
   RESET
========================= */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
}

/* =========================
   LOGIN BACKGROUND
========================= */

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;

  background:
    radial-gradient(
      circle at 15% 15%,
      rgba(255,255,255,.25),
      transparent 30%
    ),
    radial-gradient(
      circle at 85% 85%,
      rgba(255,255,255,.15),
      transparent 30%
    ),
    linear-gradient(
      135deg,
      #8b0000 0%,
      #c8102e 50%,
      #ed1c24 100%
    );
}

/* =========================
   LOGIN BOX
========================= */

.login-box{
  width:100%;
  max-width:390px;

  background:#ffffff;

  padding:32px;

  border-radius:22px;

  text-align:center;

  box-shadow:
    0 20px 50px rgba(0,0,0,.30);

  animation:loginMasuk .5s ease;
}

/* =========================
   ANIMASI
========================= */

@keyframes loginMasuk{

  from{
    opacity:0;
    transform:translateY(20px) scale(.97);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }

}

/* =========================
   LOGO
========================= */

.login-logo{

  width:85px;
  height:85px;

  margin:0 auto 18px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#fff0f0;

  border:3px solid #ed1c24;

  border-radius:50%;

  font-size:46px;

  box-shadow:
    0 8px 20px rgba(198,16,46,.20);

}

/* =========================
   JUDUL
========================= */

.login-box h1{

  margin:0;

  color:#b00020;

  font-size:26px;

  font-weight:700;

}

.login-subtitle{

  margin:8px 0 25px;

  color:#666;

  font-size:13px;

  line-height:1.6;

}

/* =========================
   LABEL
========================= */

.login-box label{

  display:block;

  text-align:left;

  margin:14px 0 7px;

  color:#333;

  font-size:14px;

  font-weight:600;

}

/* =========================
   INPUT
========================= */

.login-box input{

  width:100%;

  height:46px;

  padding:0 14px;

  border:1px solid #ddd;

  border-radius:10px;

  outline:none;

  background:#fffafa;

  color:#333;

  font-size:14px;

  transition:.2s;

}

.login-box input::placeholder{

  color:#999;

}

.login-box input:focus{

  border-color:#d71920;

  background:#fff;

  box-shadow:
    0 0 0 3px rgba(215,25,32,.12);

}

/* =========================
   TOMBOL MASUK
========================= */

.login-button{

  width:100%;

  height:48px;

  margin-top:20px;

  border:0;

  border-radius:11px;

  background:
    linear-gradient(
      135deg,
      #a90000,
      #ed1c24
    );

  color:white;

  font-size:15px;

  font-weight:bold;

  cursor:pointer;

  box-shadow:
    0 7px 18px rgba(169,0,0,.30);

  transition:.2s;

}

.login-button:hover{

  transform:translateY(-2px);

  box-shadow:
    0 10px 22px rgba(169,0,0,.38);

}

.login-button:active{

  transform:translateY(0);

}

/* =========================
   ERROR LOGIN
========================= */

#loginError{

  min-height:20px;

  margin-top:12px;

  color:#b00020;

  font-size:13px;

}

/* =========================
   GARIS MERAH PUTIH
========================= */

.login-line{

  width:60px;

  height:4px;

  margin:18px auto 0;

  border-radius:10px;

  background:
    linear-gradient(
      to right,
      #ed1c24 50%,
      #ffffff 50%
    );

  border:1px solid #ed1c24;

}

/* =========================
   TAMPILAN HP
========================= */

@media(max-width:480px){

  .login{

    padding:15px;

  }

  .login-box{

    padding:27px 20px;

    border-radius:18px;

  }

  .login-box h1{

    font-size:23px;

  }

}

/* =========================
   HIDDEN APP
========================= */

#app{

  display:none;

}

</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginPage" class="login">

  <div class="login-box">

    <div class="login-logo">
      🏘️
    </div>

    <h1>
      Desa Wawongkolono
    </h1>

    <div class="login-subtitle">
      Kecamatan Menui Kepulauan<br>
      Kabupaten Morowali<br>
      Sulawesi Tengah
    </div>

    <label for="username">
      Username
    </label>

    <input
      id="username"
      type="text"
      placeholder="Masukkan username"
      autocomplete="username"
    >

    <label for="password">
      Password
    </label>

    <input
      id="password"
      type="password"
      placeholder="Masukkan password"
      autocomplete="current-password"
      onkeydown="if(event.key==='Enter')login()"
    >

    <button
      class="login-button"
      onclick="login()"
    >
      🔐 MASUK
    </button>

    <div id="loginError"></div>

    <div class="login-line"></div>

  </div>

</div>


<!-- =========================
     CONTOH APP
     Jangan diubah kalau sudah
     ada aplikasi utama
========================= -->

<div id="app">
</div>


<script>

/* =========================
   AKUN
========================= */

const akun={

  "admin@wawongkolono.desa":{
    nama:"Administrator / Kepala Desa",
    dusun:"ALL"
  },

  "kades":{
    nama:"Kepala Desa",
    dusun:"ALL"
  },

  "operator":{
    nama:"Operator Desa",
    dusun:"ALL"
  },

  "dusun1":{
    nama:"Kepala Dusun 1",
    dusun:"Dusun 1"
  },

  "dusun2":{
    nama:"Kepala Dusun 2",
    dusun:"Dusun 2"
  },

  "dusun3":{
    nama:"Kepala Dusun 3",
    dusun:"Dusun 3"
  },

  "dusun4":{
    nama:"Kepala Dusun 4",
    dusun:"Dusun 4"
  },

  "dusun5":{
    nama:"Kepala Dusun 5",
    dusun:"Dusun 5"
  }

};


/* =========================
   PASSWORD
========================= */

const PASSWORD="desa123";


/* =========================
   LOGIN
========================= */

function login(){

  const u=document
    .getElementById("username")
    .value
    .trim()
    .toLowerCase();

  const p=document
    .getElementById("password")
    .value;

  const error=document
    .getElementById("loginError");


  if(!akun[u]){

    error.textContent=
      "Username tidak terdaftar.";

    return;

  }


  if(p!==PASSWORD){

    error.textContent=
      "Password salah.";

    return;

  }


  const currentUser={

    username:u,

    nama:akun[u].nama,

    dusun:akun[u].dusun

  };


  sessionStorage.setItem(
    "DESA_USER",
    JSON.stringify(currentUser)
  );


  document
    .getElementById("loginPage")
    .style.display="none";


  document
    .getElementById("app")
    .style.display="block";

}


/* =========================
   ENTER LOGIN
========================= */

document
  .getElementById("username")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key==="Enter"){

        document
          .getElementById("password")
          .focus();

      }

    }
  );

</script>

</body>
</html>
